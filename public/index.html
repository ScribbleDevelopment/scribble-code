<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribbleCDN // Raw Script Dispenser</title>
    <style>
        :root {
            --bg-primary: #07080c;
            --bg-secondary: #0d0f17;
            --accent-neon: #00ffcc;
            --accent-purple: #9d4edd;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e2235;
            --success: #06d6a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple));
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .code-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--accent-neon);
            word-break: break-all;
            margin-bottom: 20px;
            text-align: left;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 214, 160, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11.5px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ScribbleCDN // Raw Dispenser</h1>
        <p>Decentralized script payload distribution network powered by Cloudflare Workers KV.</p>
        
        <div class="code-box">
            Endpoint Template:<br>
            https://backend.amandarhoades2.workers.dev/api/script/[id]
        </div>

        <div class="status-indicator">
            <div class="status-dot"></div>
            <span id="backendStatusText">Checking Cloudflare KV Node...</span>
        </div>

        <div class="footer-note">
            // AUTHOR: tengo_yo // SECURE STORAGE ACTIVE
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://backend.amandarhoades2.workers.dev";

        async function checkNodeStatus() {
            const statusEl = document.getElementById('backendStatusText');
            try {
                const res = await fetch(BACKEND_URL);
                if (res.ok) {
                    statusEl.innerText = "CDN Edge Node Online";
                } else {
                    statusEl.innerText = "Node Responded with Error";
                }
            } catch (err) {
                statusEl.innerText = "Node Offline / CORS Protected";
            }
        }

        window.addEventListener('DOMContentLoaded', checkNodeStatus);
    </script>
</body>
</html>
